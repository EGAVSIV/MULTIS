name: Sync Copied Data
on:
  repository_dispatch:
    types: [data_collector_updated]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requests
        run: pip install requests
      - name: Copy changed source data
        run: python Datacopier.py
      - name: Commit copied data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add COPIEDDATA
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "Auto sync copied market data"
            git push
          fi
