# COPY THIS FILE'S 'Notify MULTIS' STEP INTO THE EXISTING
# EGAVSIV/Data-Collector update workflow AFTER it commits/pushes stock data.
# Do not create this file in MULTIS; it is included only as an installation reference.

- name: Notify MULTIS after source data update
  if: success()
  env:
    MULTIS_TOKEN: ${{ secrets.MULTIS_REPO_TOKEN }}
  run: |
    curl --fail-with-body -L \
      -X POST \
      -H "Accept: application/vnd.github+json" \
      -H "Authorization: Bearer $MULTIS_TOKEN" \
      -H "X-GitHub-Api-Version: 2022-11-28" \
      https://api.github.com/repos/EGAVSIV/MULTIS/dispatches \
      -d '{"event_type":"data_collector_updated"}'
