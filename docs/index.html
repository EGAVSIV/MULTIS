<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NSE Multi-Timeframe Stock Screener</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script></head><body>
<header><div><h1>📊 Multi-Timeframe Stock Screener</h1><p>Quant Intelligence • NSE Scanner</p></div><button id="refreshBtn">↻ Refresh Data</button></header>
<main><aside class="panel controls"><h2>Scanner Controls</h2><label>Timeframe<select id="timeframe"></select></label><label>Scanner<select id="scanner"></select></label><label>Analysis Date<input type="date" id="analysisDate"></label><button class="primary" id="runBtn">🚀 RUN SCANNER</button><hr><h3>🔍 Single Stock Scan</h3><label>Stock<select id="symbol"></select></label><button id="matrixBtn">Run Scanner Matrix</button></aside>
<section class="content"><div id="status" class="status">Loading latest market data…</div><section class="cards" id="candleCards"></section><section class="scanner-grid" id="scannerTiles"></section><div class="result-head"><h2 id="resultTitle">Scanner Results</h2><div><input id="search" placeholder="Search symbol"><button id="downloadBtn">⬇ CSV</button></div></div><div class="table-wrap"><table id="resultsTable"><thead></thead><tbody></tbody></table></div><div class="lower"><div class="chart-box"><canvas id="rsiChart"></canvas></div><div class="matrix-box"><h2>🧾 Scanner Matrix</h2><div id="matrix"></div></div></div></section></main><footer>⚡ NSE Stock Scanner • HTML + JavaScript + Python Calculation Engine</footer><script src="app.js"></script></body></html>
